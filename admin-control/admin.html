<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RoRo | Admin Control</title>
    <style>
        :root { --bg: #0a0a0a; --accent: #c8a96e; --border: #222; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; padding: 40px; }
        .card { background: #111; border: 1px solid var(--border); padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        h2 { color: var(--accent); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; }
        textarea { w-100; background: #000; color: #ccc; border: 1px solid var(--border); width: 100%; height: 100px; padding: 10px; margin-top: 10px; }
        button { background: var(--accent); color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .field-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.7rem; color: #666; margin-bottom: 5px; }
    </style>
</head>
<body>
    <h1>RoRo Config Engine</h1>
    <div id="editor"></div>
    <button onclick="saveConfig()">Save Changes</button>

    <script>
        // In a real scenario, this would fetch the .js file or interact with a backend
        // Here we simulate loading the window.RORO_CONFIG
        const config = window.opener ? window.opener.RORO_CONFIG : {};

        function renderEditor() {
            const container = document.getElementById('editor');
            container.innerHTML = `
                <div class="card">
                    <h2>Owner Identity</h2>
                    <div class="field-group">
                        <label>Name</label>
                        <input type="text" id="owner-name" value="${config.owner.name}" style="width:100%">
                    </div>
                    <div class="field-group">
                        <label>Tagline</label>
                        <textarea id="owner-tagline">${config.owner.tagline}</textarea>
                    </div>
                </div>
                <div class="card">
                    <h2>Master JSON (Advanced)</h2>
                    <textarea id="raw-json" style="height: 400px;">${JSON.stringify(config, null, 4)}</textarea>
                </div>
            `;
        }

        function saveConfig() {
            const newConfig = JSON.parse(document.getElementById('raw-json').value);
            console.log("New Config Prepared:", newConfig);
            alert("In a production environment, this would rewrite your manager-roro(3).js file via a server-side script.");
        }

        renderEditor();
    </script>
</body>
</html>
