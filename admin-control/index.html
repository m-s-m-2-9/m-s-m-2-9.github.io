<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MSM | RoRo Admin</title>
    <style>
        :root { --bg: #050505; --accent: #c8a96e; --border: #1a1a1a; }
        body { background: var(--bg); color: #fff; font-family: monospace; padding: 40px; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; }
        .section { background: #0c0c0c; border: 1px solid var(--border); padding: 30px; border-radius: 12px; margin-bottom: 20px; }
        h1, h2 { color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
        textarea, input { width: 100%; background: #000; color: #fff; border: 1px solid var(--border); padding: 12px; border-radius: 6px; margin: 10px 0; font-family: inherit; }
        .btn { background: var(--accent); color: #000; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .btn:hover { opacity: 0.8; }
        label { font-size: 11px; color: #555; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="container">
        <h1>RoRo Configuration Center</h1>
        <div id="sections"></div>
        <button class="btn" onclick="exportConfig()">Export manager-roro(3).js</button>
    </div>

    <script src="../../js/bot/manager-roro(3).js"></script> <!-- Load live config -->
    <script>
        const config = window.RORO_CONFIG;

        function init() {
            const div = document.getElementById('sections');
            div.innerHTML = `
                <div class="section">
                    <h2>Owner Identity</h2>
                    <label>Full Name</label>
                    <input type="text" id="owner-name" value="${config.owner.name}">
                    <label>Description</label>
                    <textarea id="owner-desc">${config.owner.description}</textarea>
                </div>
                <div class="section">
                    <h2>Knowledge JSON</h2>
                    <label>Paste the entire RORO_CONFIG JSON below to batch edit</label>
                    <textarea id="full-json" style="height: 500px;">${JSON.stringify(config, null, 4)}</textarea>
                </div>
            `;
        }

        function exportConfig() {
            const data = document.getElementById('full-json').value;
            const blob = new Blob([`window.RORO_CONFIG = ${data};`], { type: 'text/javascript' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'manager-roro(3).js';
            a.click();
            alert("File generated. Replace your existing 'js/bot/manager-roro(3).js' with this file.");
        }

        window.onload = init;
    </script>
</body>
</html>
